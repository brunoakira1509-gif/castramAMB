{% extends "base.html" %}
{% block title %}Cadastrar animal{% endblock %}
{% block content %}
<div class="page-head"><h1>Cadastrar animal</h1></div>
<form method="POST" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
        <div class="field full">
            <label for="tutor-busca">Tutor</label>
            <input type="search" id="tutor-busca" placeholder="Digite o nome ou CPF para buscar"
                   data-filter-select="tutor_id" autocomplete="off" aria-controls="tutor_id">
            <p class="hint">Busque e selecione o tutor na lista.</p>
            <select name="tutor_id" id="tutor_id" required class="mt-8" aria-label="Tutor">
                <option value="">Selecione um tutor</option>
                {% for tutor in tutores %}
                    <option value="{{ tutor.id }}">{{ tutor.nome_completo }} - {{ tutor.cpf }}</option>
                {% endfor %}
            </select>
            {% if not tutores %}<p class="hint">Nenhum tutor cadastrado. <a href="{{ url_for('cadastrar_tutor') }}">Cadastrar tutor</a></p>{% endif %}
        </div>
        <div class="field"><label for="nome">Nome</label><input type="text" id="nome" name="nome" required></div>
        <div class="field">
            <label for="especie">Espécie</label>
            <select name="especie" id="especie" required>
                <option value="">Selecione uma espécie</option>
                <option value="cao">Cão</option>
                <option value="gato">Gato</option>
            </select>
        </div>
        <div class="field"><label for="raca">Raça</label><input type="text" id="raca" name="raca" required></div>
        <div class="field">
            <label for="sexo">Sexo</label>
            <select name="sexo" id="sexo" required>
                <option value="macho">Macho</option>
                <option value="femea">Fêmea</option>
            </select>
        </div>
        <div class="field"><label for="microchip">Microchip</label><input type="text" id="microchip" name="microchip"></div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn">Cadastrar animal</button>
        <a href="{{ url_for('index') }}" class="btn secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
