{% extends "base.html" %}
{% block title %}Cadastrar tutor{% endblock %}
{% block content %}
<div class="page-head"><h1>Cadastrar tutor</h1></div>
<form method="POST" enctype="multipart/form-data" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
        <div class="field full"><label for="nome">Nome completo</label><input type="text" id="nome" name="nome" required autofocus></div>
        <div class="field"><label for="cpf">CPF</label><input type="text" id="cpf" name="cpf" inputmode="numeric" required></div>
        <div class="field"><label for="telefone">Telefone</label><input type="tel" id="telefone" name="telefone" required></div>
        <div class="field w4"><label for="endereco">Endereço</label><input type="text" id="endereco" name="endereco" required></div>
        <div class="field w2"><label for="numero">Número</label><input type="text" id="numero" name="numero" required></div>
        <div class="field full">
            <label for="documentos">Documentos</label>
            <input type="file" id="documentos" name="documentos" multiple>
            <p class="hint">Opcional. PDF, imagem, Word, Excel ou texto, até 16 MB por envio.</p>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn">Cadastrar tutor</button>
        <a href="{{ url_for('index') }}" class="btn secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
