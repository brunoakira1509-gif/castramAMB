{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="auth-brand">{{ icon('paw', 22) }}CastraMóvel</div>
<form method="POST" class="card auth-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Entrar</h1>
    <div class="form-grid">
        <div class="field full"><label for="usuario">Usuário</label><input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus></div>
        <div class="field full"><label for="senha">Senha</label><input type="password" id="senha" name="senha" autocomplete="current-password" required></div>
    </div>
    <div class="form-actions"><button type="submit" class="btn">Entrar</button></div>
</form>
{% endblock %}
